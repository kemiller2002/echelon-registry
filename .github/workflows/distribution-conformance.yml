name: Registry distribution conformance

on:
  pull_request:
  push:
    branches:
      - main
      - requirements/indy-init-distribution
      - implementation/distribution-registry-foundation
      - implementation/indy-init-release-catalog
      - implementation/indy-init-freeze
      - implementation/indy-init-freeze-receipt

permissions:
  contents: read

jobs:
  distribution-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Report Indy Init catalog hashes
        run: |
          for path in profiles/indy-init.profile.json releases/limen/0.6.2.release.json releases/aegis/1.0.0.release.json releases/folio/0.3.0.release.json; do
            if [ -f "$path" ]; then
              printf 'CATALOG_HASH|%s|%s\n' "$path" "$(sha256sum "$path" | awk '{print $1}')"
            fi
          done

      - name: Resolve Echelon engineering profile twice
        run: |
          mkdir -p "$RUNNER_TEMP/resolver-a" "$RUNNER_TEMP/resolver-b"
          dotnet fsi tools/resolve-profile.fsx -- \
            --profile profiles/echelon-engineering.profile.json \
            --snapshot snapshots/echelon-engineering-0.1.0.catalog.json \
            --platform linux-x64 \
            --output "$RUNNER_TEMP/resolver-a/linux-x64.json"
          dotnet fsi tools/resolve-profile.fsx -- \
            --profile profiles/echelon-engineering.profile.json \
            --snapshot snapshots/echelon-engineering-0.1.0.catalog.json \
            --platform linux-x64 \
            --output "$RUNNER_TEMP/resolver-b/linux-x64.json"
          cmp "$RUNNER_TEMP/resolver-a/linux-x64.json" "$RUNNER_TEMP/resolver-b/linux-x64.json"

      - name: Resolve Dokimos distribution proof profile twice
        run: |
          mkdir -p "$RUNNER_TEMP/dokimos-proof-a" "$RUNNER_TEMP/dokimos-proof-b"
          for out in dokimos-proof-a dokimos-proof-b; do
            dotnet fsi tools/resolve-profile.fsx -- \
              --profile profiles/dokimos-proof.profile.json \
              --snapshot snapshots/dokimos-proof-0.1.0.catalog.json \
              --platform linux-x64 \
              --output "$RUNNER_TEMP/$out/linux-x64.json"
          done
          cmp "$RUNNER_TEMP/dokimos-proof-a/linux-x64.json" "$RUNNER_TEMP/dokimos-proof-b/linux-x64.json"

      - name: Resolve Echelon engineering 0.2.0 on every supported platform
        run: |
          mkdir -p "$RUNNER_TEMP/engineering-020"
          for platform in linux-arm64 linux-musl-x64 linux-x64 osx-arm64 osx-x64 win-x64; do
            dotnet fsi tools/resolve-profile.fsx -- \
              --profile profiles/echelon-engineering-0.2.0.profile.json \
              --snapshot snapshots/echelon-engineering-0.2.0.catalog.json \
              --platform "$platform" \
              --output "$RUNNER_TEMP/engineering-020/$platform.json"
          done

      - name: Regenerate and validate Echelon current channel
        run: |
          mkdir -p "$RUNNER_TEMP/echelon-current"
          for platform in linux-x64 linux-arm64 osx-x64 osx-arm64 win-x64; do
            dotnet fsi tools/resolve-profile.fsx -- \
              --profile profiles/echelon-current.profile.json \
              --snapshot snapshots/echelon-current.catalog.json \
              --platform "$platform" \
              --output "$RUNNER_TEMP/echelon-current/$platform.json"
            cmp "$RUNNER_TEMP/echelon-current/$platform.json" "channels/echelon-current/$platform.json"
          done
          # The resolved sets are now proven equal to the regenerated bytes, so
          # the index generated over the committed directory must match too.
          dotnet fsi tools/generate-channel-index.fsx -- \
            --channel channels/echelon-current \
            --profile profiles/echelon-current.profile.json \
            --snapshot snapshots/echelon-current.catalog.json \
            --output "$RUNNER_TEMP/echelon-current/channel.json"
          if ! cmp "$RUNNER_TEMP/echelon-current/channel.json" channels/echelon-current/channel.json; then
            echo "::error::channels/echelon-current/channel.json is stale; regenerate it with tools/generate-channel-index.fsx"
            diff -u channels/echelon-current/channel.json "$RUNNER_TEMP/echelon-current/channel.json" || true
            exit 1
          fi
          dotnet fsi conformance/validate-current-channel.fsx

      # REG-PAIR-001-R1 (spec/capability-pairing.md): the resolver refuses a
      # set that enables a paired capability's host side without its paired
      # side, unless the snapshot records the capability as disabled.
      - name: Validate capability pairing constraints (REG-PAIR-001-R1)
        run: dotnet fsi conformance/validate-capability-pairing.fsx

      # REG-PAIR-001-R3: no record names a release manifest that does not exist.
      - name: Validate release manifest references (REG-PAIR-001-R3)
        run: dotnet fsi conformance/validate-manifest-references.fsx

      # REG-RU-007 (spec/rolling-upgrade-requirements.md): the channel must not
      # select a version of a consumer-declared component that the latest
      # released Conditor refuses. The binary is checked against its release
      # checksums and build-provenance attestation before it runs.
      - name: Check echelon-current against the latest released Conditor (REG-RU-007)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir="$RUNNER_TEMP/conditor-latest"
          mkdir -p "$dir"
          tag=$(gh api repos/kemiller2002/conditor/releases/latest --jq .tag_name)
          echo "Latest released Conditor: $tag"
          gh release download "$tag" -R kemiller2002/conditor -p conditor-linux-x64 -p checksums.txt -D "$dir"
          (cd "$dir" && grep ' conditor-linux-x64$' checksums.txt | sha256sum -c -)
          gh attestation verify "$dir/conditor-linux-x64" -R kemiller2002/conditor \
            --signer-workflow kemiller2002/conditor/.github/workflows/release.yml \
            --source-ref "refs/tags/$tag"
          chmod +x "$dir/conditor-linux-x64"
          "$dir/conditor-linux-x64" compatibility --json > "$dir/compatibility.json"
          dotnet fsi conformance/validate-conditor-qualification.fsx "$dir/compatibility.json"

      - name: Validate Registry distribution fixtures and generated resolution
        env:
          ECHELON_ENGINEERING_020_RESOLVED_DIR: ${{ runner.temp }}/engineering-020
          ECHELON_ENGINEERING_RESOLVED: ${{ runner.temp }}/resolver-a/linux-x64.json
          DOKIMOS_PROOF_RESOLVED: ${{ runner.temp }}/dokimos-proof-a/linux-x64.json
        run: dotnet fsi conformance/validate-distribution-fixtures.fsx

      - name: Resolve repository lifecycle contract fixtures
        run: |
          mkdir -p "$RUNNER_TEMP/lifecycle"
          dotnet fsi tools/resolve-profile.fsx -- \
            --profile examples/repository-lifecycle-proof/repository-lifecycle-proof.profile.json \
            --snapshot examples/repository-lifecycle-proof/catalog-snapshot.json \
            --platform linux-x64 \
            --output "$RUNNER_TEMP/lifecycle/linux-x64.json"
          if dotnet fsi tools/resolve-profile.fsx -- \
            --profile examples/repository-lifecycle-proof/repository-lifecycle-invalid.profile.json \
            --snapshot examples/repository-lifecycle-proof/catalog-snapshot.json \
            --platform linux-x64 \
            --output "$RUNNER_TEMP/lifecycle/invalid.json"; then
            echo "::error::resolver accepted a repository lifecycle declaration on a non-native release"
            exit 1
          fi

      - name: Validate repository lifecycle contract
        run: dotnet fsi conformance/validate-repository-lifecycle.fsx "$RUNNER_TEMP/lifecycle/linux-x64.json"

      - name: Validate Indy Init catalog progress
        run: dotnet fsi conformance/validate-indy-init-catalog.fsx

      - name: Resolve frozen Indy Init profile twice on supported platforms
        run: |
          mkdir -p "$RUNNER_TEMP/indy-init-a" "$RUNNER_TEMP/indy-init-b"
          for platform in linux-x64 osx-arm64; do
            dotnet fsi tools/resolve-profile.fsx -- \
              --profile profiles/indy-init.profile.json \
              --snapshot snapshots/indy-init-0.1.0.catalog.json \
              --platform "$platform" \
              --output "$RUNNER_TEMP/indy-init-a/$platform.json"
            dotnet fsi tools/resolve-profile.fsx -- \
              --profile profiles/indy-init.profile.json \
              --snapshot snapshots/indy-init-0.1.0.catalog.json \
              --platform "$platform" \
              --output "$RUNNER_TEMP/indy-init-b/$platform.json"
            cmp "$RUNNER_TEMP/indy-init-a/$platform.json" "$RUNNER_TEMP/indy-init-b/$platform.json"
          done

      - name: Publish frozen Indy Init resolved sets
        uses: actions/upload-artifact@v4
        with:
          name: indy-init-0.1.0-resolved-sets
          path: ${{ runner.temp }}/indy-init-a/*.json
          if-no-files-found: error

      - name: Validate durable Indy Init freeze receipt
        env:
          INDY_INIT_RESOLVED_DIR: ${{ runner.temp }}/indy-init-a
        run: dotnet fsi conformance/validate-indy-init-freeze.fsx

      - name: Generate release contract fixture
        uses: ./actions/release-contract
        with:
          release-input: examples/release-contract/release-input.json
          artifact-dir: examples/release-contract/artifacts
          output: examples/release-contract/generated.release.json
          version: 1.2.3
          tag: v1.2.3
          commit: '1111111111111111111111111111111111111111'
          release-stage: preview

      - name: Validate generated release contract
        run: dotnet fsi conformance/validate-release-generation.fsx examples/release-contract/generated.release.json
