name: Portfolio validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  portfolio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Unit, property and acceptance tests
        run: dotnet test tools/portfolio/Echelon.Portfolio.slnx -c Release
      - name: Validate public portfolio records
        run: dotnet run --project tools/portfolio/src/Echelon.Portfolio.Cli -c Release -- validate --root .
      - name: Generated views are current
        run: dotnet run --project tools/portfolio/src/Echelon.Portfolio.Cli -c Release -- render --root . --check
